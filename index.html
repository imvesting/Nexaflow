<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>NexaFlow — Acceso</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(145deg,#080d19,#10182c 55%,#0b1222); color:#fff;
      display:flex; align-items:center; justify-content:center; padding:20px;
    }
    .wrap{width:100%;max-width:430px}
    .brand{text-align:center;margin-bottom:24px}
    .logo{
      width:64px;height:64px;border-radius:20px;margin:0 auto 14px;
      display:grid;place-items:center;font-weight:900;font-size:25px;
      background:linear-gradient(135deg,#39d98a,#1aa66a);
      box-shadow:0 14px 40px rgba(32,210,133,.22);
    }
    h1{margin:0;font-size:30px;letter-spacing:-.8px}
    .sub{margin:7px 0 0;color:#9da8bd;font-size:14px}
    .card{
      background:rgba(17,25,43,.94);border:1px solid #26324b;border-radius:24px;
      padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.35);backdrop-filter:blur(12px)
    }
    .tabs{display:grid;grid-template-columns:1fr 1fr;background:#0b1220;padding:4px;border-radius:13px;margin-bottom:22px}
    .tab{border:0;background:transparent;color:#8793aa;padding:11px;border-radius:10px;font-weight:700;cursor:pointer}
    .tab.active{background:#202b42;color:#fff}
    label{display:block;font-size:13px;color:#b9c2d3;margin:15px 0 7px}
    input{
      width:100%;padding:14px 15px;border-radius:12px;border:1px solid #34415c;
      background:#0b1220;color:#fff;outline:none;font-size:15px
    }
    input:focus{border-color:#3bd992;box-shadow:0 0 0 3px rgba(59,217,146,.1)}
    button.primary{
      width:100%;margin-top:20px;border:0;border-radius:12px;padding:14px;
      background:#32d48a;color:#06150e;font-weight:900;font-size:15px;cursor:pointer
    }
    button.primary:disabled{opacity:.55;cursor:not-allowed}
    .forgot{display:block;text-align:right;margin-top:9px;color:#69e6ad;font-size:13px;text-decoration:none;cursor:pointer}
    .msg{display:none;padding:11px 12px;border-radius:10px;margin-top:15px;font-size:13px;line-height:1.4}
    .msg.show{display:block}
    .msg.error{background:#351b24;color:#ffb8c7;border:1px solid #713144}
    .msg.ok{background:#123326;color:#a7f3cd;border:1px solid #236747}
    .panel{display:none}
    .panel.active{display:block}
    .dashboard{text-align:center}
    .badge{display:inline-block;padding:7px 10px;border-radius:999px;background:#123326;color:#8df0be;font-size:12px;font-weight:800;margin-bottom:12px}
    .email{color:#c5cedd;word-break:break-word}
    .logout{margin-top:18px;background:#202b42!important;color:#fff!important}
    .loading{display:none;text-align:center;color:#aeb9ca;font-size:13px;margin-top:12px}
    .loading.show{display:block}
    .foot{text-align:center;color:#66738b;font-size:11px;margin-top:15px}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="brand">
      <div class="logo">N</div>
      <h1>NexaFlow</h1>
      <p class="sub">Tu plataforma de activos digitales</p>
    </section>

    <section class="card">
      <div id="authView">
        <div class="tabs">
          <button id="loginTab" class="tab active" type="button">Iniciar sesión</button>
          <button id="signupTab" class="tab" type="button">Crear cuenta</button>
        </div>

        <div id="loginPanel" class="panel active">
          <form id="loginForm">
            <label for="loginEmail">Correo electrónico</label>
            <input id="loginEmail" type="email" autocomplete="email" required placeholder="tu@email.com">
            <label for="loginPassword">Contraseña</label>
            <input id="loginPassword" type="password" autocomplete="current-password" required minlength="6" placeholder="Tu contraseña">
            <a id="forgotBtn" class="forgot">¿Olvidaste tu contraseña?</a>
            <button id="loginBtn" class="primary" type="submit">Iniciar sesión</button>
          </form>
        </div>

        <div id="signupPanel" class="panel">
          <form id="signupForm">
            <label for="signupName">Nombre</label>
            <input id="signupName" type="text" autocomplete="name" required maxlength="100" placeholder="Tu nombre">
            <label for="signupEmail">Correo electrónico</label>
            <input id="signupEmail" type="email" autocomplete="email" required placeholder="tu@email.com">
            <label for="signupPassword">Contraseña</label>
            <input id="signupPassword" type="password" autocomplete="new-password" required minlength="8" placeholder="Mínimo 8 caracteres">
            <label for="signupPassword2">Confirmar contraseña</label>
            <input id="signupPassword2" type="password" autocomplete="new-password" required minlength="8" placeholder="Repite tu contraseña">
            <button id="signupBtn" class="primary" type="submit">Crear cuenta</button>
          </form>
        </div>

        <div id="message" class="msg"></div>
        <div id="loading" class="loading">Procesando…</div>
      </div>

      <div id="dashboardView" class="dashboard" style="display:none">
        <span class="badge">Sesión iniciada</span>
        <h2>Bienvenido a NexaFlow</h2>
        <p class="email" id="userEmail"></p>
        <button id="logoutBtn" class="primary logout" type="button">Cerrar sesión</button>
        <div id="dashMessage" class="msg"></div>
      </div>
    </section>

    <div class="foot">Conexión protegida mediante Supabase Auth</div>
  </main>

<script>
  // ==========================================================
  // CONFIGURACIÓN
  // Pega aquí solamente la Project URL y la Publishable/Anon key.
  // NUNCA pongas service_role, secret keys, private keys o seeds.
  // ==========================================================
  const SUPABASE_URL = "https://nevxvhwpxsiazfvjtxzo.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_U3fl6i8_QfheNfca-sGbhA_zs-K1RHu";

  let supabaseClient = null;

  const $ = (id) => document.getElementById(id);

  function configOk() {
    return SUPABASE_URL.startsWith("https://")
      && !SUPABASE_URL.includes("PON_AQUI")
      && SUPABASE_ANON_KEY.length > 20
      && !SUPABASE_ANON_KEY.includes("PON_AQUI");
  }

  function showMessage(text, type="error") {
    const el = $("message");
    el.textContent = text;
    el.className = "msg show " + type;
  }

  function clearMessage() {
    $("message").className = "msg";
    $("message").textContent = "";
  }

  function setLoading(on, button=null) {
    $("loading").classList.toggle("show", on);
    document.querySelectorAll("button.primary").forEach(b => b.disabled = on);
    if (button) button.disabled = on;
  }

  function friendlyError(error) {
    const m = (error?.message || "").toLowerCase();
    if (m.includes("invalid login credentials")) return "Correo o contraseña incorrectos.";
    if (m.includes("email not confirmed")) return "Debes confirmar tu correo electrónico antes de iniciar sesión.";
    if (m.includes("user already registered")) return "Ya existe una cuenta con ese correo.";
    if (m.includes("password")) return "La contraseña no cumple los requisitos.";
    if (m.includes("rate limit")) return "Demasiados intentos. Espera unos minutos e inténtalo de nuevo.";
    if (m.includes("network")) return "No se pudo conectar con Supabase. Comprueba tu conexión.";
    return error?.message || "Ocurrió un error. Inténtalo nuevamente.";
  }

  function showDashboard(session) {
    $("authView").style.display = "none";
    $("dashboardView").style.display = "block";
    $("userEmail").textContent = session?.user?.email || "";
  }

  function showAuth() {
    $("authView").style.display = "block";
    $("dashboardView").style.display = "none";
  }

  async function init() {
    if (!configOk()) {
      showMessage("Falta configurar SUPABASE_URL y SUPABASE_PUBLISHABLE_O_ANON_KEY en este archivo.");
      return;
    }

    try {
      const { data, error } = await supabaseClient.auth.getSession();
      if (error) throw error;
      if (data.session) {
        showDashboard(data.session);
      }

      supabaseClient.auth.onAuthStateChange((_event, session) => {
        if (session) showDashboard(session);
        else showAuth();
      });
    } catch (e) {
      showMessage("No se pudo inicializar la autenticación: " + friendlyError(e));
    }
  }

  $("loginTab").addEventListener("click", () => {
    $("loginTab").classList.add("active");
    $("signupTab").classList.remove("active");
    $("loginPanel").classList.add("active");
    $("signupPanel").classList.remove("active");
    clearMessage();
  });

  $("signupTab").addEventListener("click", () => {
    $("signupTab").classList.add("active");
    $("loginTab").classList.remove("active");
    $("signupPanel").classList.add("active");
    $("loginPanel").classList.remove("active");
    clearMessage();
  });

  $("loginForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    clearMessage();

    const email = $("loginEmail").value.trim();
    const password = $("loginPassword").value;

    setLoading(true, $("loginBtn"));

    try {
      const { error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;
    } catch (e) {
      showMessage(friendlyError(e));
    } finally {
      setLoading(false);
    }
  });

  $("signupForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    clearMessage();

    const name = $("signupName").value.trim();
    const email = $("signupEmail").value.trim();
    const password = $("signupPassword").value;
    const password2 = $("signupPassword2").value;

    if (password !== password2) {
      showMessage("Las contraseñas no coinciden.");
      return;
    }

    if (password.length < 8) {
      showMessage("La contraseña debe tener al menos 8 caracteres.");
      return;
    }

    setLoading(true, $("signupBtn"));

    try {
      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: name
          }
        }
      });

      if (error) throw error;

      if (data.session) {
        showDashboard(data.session);
      } else {
        showMessage("Cuenta creada. Revisa tu correo para confirmar la cuenta.", "ok");
        $("signupForm").reset();
      }
    } catch (e) {
      showMessage(friendlyError(e));
    } finally {
      setLoading(false);
    }
  });

  $("forgotBtn").addEventListener("click", async () => {
    clearMessage();
    const email = $("loginEmail").value.trim();

    if (!email) {
      showMessage("Escribe primero tu correo electrónico.");
      $("loginEmail").focus();
      return;
    }

    setLoading(true);

    try {
      const redirectTo = window.location.origin + window.location.pathname;
      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo
      });

      if (error) throw error;

      showMessage("Si el correo existe, recibirás instrucciones para restablecer la contraseña.", "ok");
    } catch (e) {
      showMessage(friendlyError(e));
    } finally {
      setLoading(false);
    }
  });

  $("logoutBtn").addEventListener("click", async () => {
    try {
      const { error } = await supabaseClient.auth.signOut();
      if (error) throw error;
      showAuth();
    } catch (e) {
      $("dashMessage").textContent = friendlyError(e);
      $("dashMessage").className = "msg show error";
    }
  });

  if (window.supabase && window.supabase.createClient) {
    if (configOk()) {
      supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );
    }
  }

  if (supabaseClient) init();
  else showMessage("Configura primero las credenciales de Supabase en el archivo.");
</script>
</body>
</html>
